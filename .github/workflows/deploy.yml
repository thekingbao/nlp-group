name: 🚀 Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Build portal React ────────────────────────────────────────────────
  build-portal:
    name: Build Portal (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pages/noi-bo-react/package-lock.json

      - name: Install portal dependencies
        working-directory: pages/noi-bo-react
        run: npm ci

      - name: Build portal
        working-directory: pages/noi-bo-react
        run: npm run build
        env:
          VITE_API_URL: ''   # production dùng relative /api

      - name: Upload portal build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: noi-bo/
          retention-days: 1

  # ── Job 2: Deploy to Cloudflare Pages ────────────────────────────────────────
  deploy:
    name: Deploy → Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-portal
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portal build
        uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: noi-bo/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=nlp-group --branch=main

  # ── Job 3: Deploy Workers API ─────────────────────────────────────────────────
  deploy-workers:
    name: Deploy Workers API
    runs-on: ubuntu-latest
    needs: build-portal
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install Workers dependencies
        working-directory: workers
        run: npm ci

      - name: Deploy Workers API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: '.'
          command: deploy --env production
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
