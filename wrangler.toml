name                   = "nlpgroup"
compatibility_date     = "2024-01-01"
compatibility_flags    = ["nodejs_compat"]

# ─── Workers API entry ────────────────────────────────────────────────────────
main                   = "workers/api/index.ts"

# ─── Static assets (Cloudflare Pages static serving) ─────────────────────────
# Marketing site + portal dist are served as static files.
# Workers handles /api/* routes; everything else → static.
pages_build_output_dir = "."

# ─── D1 Database ──────────────────────────────────────────────────────────────
[[d1_databases]]
binding      = "DB"
database_name = "nlpgroup"
database_id  = "REPLACE_WITH_D1_ID"   # wrangler d1 create nlpgroup

# ─── R2 Object Storage ────────────────────────────────────────────────────────
[[r2_buckets]]
binding     = "FILES"
bucket_name = "nlpgroup-files"

# ─── KV (sessions / config) ───────────────────────────────────────────────────
[[kv_namespaces]]
binding    = "KV"
id         = "REPLACE_WITH_KV_ID"    # wrangler kv namespace create nlpgroup-kv

# ─── Secrets (set via `wrangler secret put`) ──────────────────────────────────
# JWT_SECRET        — 64-char random string
# RESEND_API_KEY    — from resend.com (Giai đoạn 5)

# ─── Local dev overrides ──────────────────────────────────────────────────────
[env.local]
name = "nlpgroup-local"

[[env.local.d1_databases]]
binding      = "DB"
database_name = "nlpgroup"
database_id  = "REPLACE_WITH_D1_ID"

[[env.local.r2_buckets]]
binding     = "FILES"
bucket_name = "nlpgroup-files-dev"

# ─── Production ───────────────────────────────────────────────────────────────
[env.production]
name = "nlpgroup"

[[env.production.d1_databases]]
binding      = "DB"
database_name = "nlpgroup"
database_id  = "REPLACE_WITH_D1_ID"

[[env.production.r2_buckets]]
binding     = "FILES"
bucket_name = "nlpgroup-files"
